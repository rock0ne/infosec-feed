name: InfoSecFeed
options:
  bundleIdPrefix: uk.cybertecpro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  InfoSecFeed:
    type: application
    platform: iOS
    sources:
      - path: InfoSecFeed
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: InfoSec Feed
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.cybertecpro.infosecfeed.ios
        PRODUCT_NAME: InfoSec Feed
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: InfoSecFeedWidget
        embed: true

  InfoSecFeedWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: InfoSecFeedWidget
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: InfoSec Feed Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.cybertecpro.infosecfeed.ios.widget
        PRODUCT_NAME: InfoSec Feed Widget
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        APPLICATION_EXTENSION_API_ONLY: true

  InfoSecFeedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InfoSecFeedTests
    dependencies:
      - target: InfoSecFeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.cybertecpro.infosecfeed.ios.tests

schemes:
  InfoSecFeed:
    build:
      targets:
        InfoSecFeed: all
        InfoSecFeedWidget: all
        InfoSecFeedTests: [test]
    test:
      targets:
        - InfoSecFeedTests
