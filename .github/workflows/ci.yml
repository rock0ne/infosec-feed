name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all platform source rosters
        run: python3 scripts/check_source_parity.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Test, lint and assemble
        run: ./gradlew test lint assembleDebug --no-daemon

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test portable iOS core
        run: swift test
      - name: Build app and widget
        run: |
          xcodebuild build \
            -project InfoSecFeed.xcodeproj \
            -scheme InfoSecFeed \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test Windows feed contract
        run: dotnet test .\windows\InfoSecFeed.Windows.Tests\InfoSecFeed.Windows.Tests.csproj --configuration Release
      - name: Publish self-contained Windows client
        run: >-
          dotnet publish .\windows\InfoSecFeed.Windows\InfoSecFeed.Windows.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false
          --output .\windows\artifacts\win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: InfoSec-Feed-Windows-win-x64
          path: windows/artifacts/win-x64/
          if-no-files-found: error
