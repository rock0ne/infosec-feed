name: Cross-platform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Test, lint and assemble
        run: ./gradlew test lint assembleDebug --no-daemon

  ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          DEVICE_ID=$(xcodebuild -project InfoSecFeed.xcodeproj -scheme InfoSecFeed -showdestinations \
            | perl -ne 'if (/platform:iOS Simulator.*id:([0-9A-Fa-f-]{36})/) { print $1; exit }')
          test -n "$DEVICE_ID"
          xcodebuild test \
            -project InfoSecFeed.xcodeproj \
            -scheme InfoSecFeed \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO
